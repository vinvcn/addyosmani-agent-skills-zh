description = "增量实现任务 — build、test、verify、commit。加上 \"auto\" 可在一次获批的执行中跑完整个 plan"

prompt = """
同时调用 incremental-implementation skill 和 test-driven-development。

## 模式

- `/build` — 实现下一个 pending task，然后停止（谨慎，一次一个切片）。
- `/build auto` — 如需要则生成 plan，获得一次批准，然后实现每一个任务，任务之间不停。

arguments 用于选择 mode。把 `auto`（canonical）或 `all` 视为 autonomous mode；其他任何值（或为空）都是默认的 single-task mode。注意：autonomous mode 并不会让单个任务更快 — 它运行同样的 test-driven loop — 它只是去掉了任务之间的人工介入。

## 默认：一个任务

从 plan 中选择下一个 pending task。然后：

1. 阅读该 task 的 acceptance criteria
2. 加载相关上下文（现有代码、patterns、types）
3. 为预期行为编写一个失败测试（RED）
4. 实现能让测试通过的最小代码（GREEN）
5. 运行完整 test suite 检查 regressions
6. 运行 build 验证 compilation
7. 使用描述性 message 提交
8. 标记该 task 完成并停止

## Autonomous：整个 plan（`/build auto`）

当 spec 已经存在、而你想把 plan + build 合并为一次运行时使用。它去掉的是任务之间的人工介入 — 而不是验证。每一个任务仍然要挣得一个通过的 test 和它自己的 commit。

1. 要求有 spec。只在已知路径查找 spec：仓库根目录的 `SPEC.md`、`docs/SPEC.md`，或 `spec/` 下的文件。README 或随便某个文档**不**算数。如果都不存在，停止并告诉用户先运行 `/spec` — 不要凭空编造需求。
2. 建立干净的基线。运行 `git status --porcelain`。如果存在预期 planning artifacts（SPEC.md、docs/SPEC.md、spec/*、tasks/plan.md、tasks/todo.md）之外的未提交变更，停下来请用户 commit、stash，或确认如何处理它们。Autonomous 的每任务 commits 绝不能吸收无关的本地工作，否则 clean-rollback 保证会被破坏。
3. 如需要则规划。如果没有 tasks/plan.md，调用 planning-and-task-breakdown skill 生成一个。
4. 单一 checkpoint。展示完整的 plan 并等待一个不含糊的肯定答复（例如 "approve"、"go"、"yes"）。把含糊的回应（"looks reasonable"、"I guess"）视为未批准。这是唯一的人工门禁 — 批准之后即自主运行。如果你生成了 tasks/plan.md，现在就把它作为一个单独的准备性 commit 提交，以免它渗入第一个任务的 commit。
5. 按 dependency order 执行每一个任务。使用每个任务声明的 dependencies；如果它们没有明确声明，就按 plan 列出它们的顺序执行。对每个任务，运行上面完整的默认 loop（RED → GREEN → regression → build → commit → mark complete）。只 stage 该任务触及的文件加上它的 task-status 更新 — 绝不盲目 `git add -A` — 并且每个任务做一个 commit，让任意时间点都是一次干净的 rollback。
6. 在下列情况停下来询问用户（不要硬推）：
   - 某个 test 无法通过，或 build 断裂且没有明显的修复 → 遵循 debugging-and-error-recovery skill
   - spec 含糊，或某个任务需要一个 spec 未覆盖的 decision
   - 某个任务高风险或不可逆 — auth/permission 变更、破坏性 data migrations、payments、删除、deploys、任何触及 secrets 的东西，或任何你用 `git revert` 都无法撤销的东西 → 遵循 doubt-driven-development skill，并在继续前获得明确的 sign-off
   用户解决一个 blocker 之后，会重新调用 /build auto — 它从下一个 pending task 继续。
7. 在结尾做总结：完成的 tasks、新增的 tests、做出的 commits，以及任何被跳过、被标记或留给用户的内容。

如果任何步骤失败，遵循 debugging-and-error-recovery skill。
"""
